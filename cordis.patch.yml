# DSH patch layer: spawn the MATLAB MCP Server (MathWorks) as a stdio MCP
# server. The DSH mcp-client plugin registers its tools as mcp__matlab__<tool>.
#
# Prerequisites:
#   1. MATLAB R2021a or later installed.
#   2. MATLAB MCP Server binary — via MathWorks Agentic Toolkits
#      (~/.matlab/agentic-toolkits/bin/matlab-mcp-server) or a release binary
#      from https://github.com/matlab/matlab-mcp-server/releases/latest.
#      Set MATLAB_MCP_SERVER_BINARY when it lives elsewhere.
#
# Override any value by patching the `matlab-mcp` row in your profile's
# cordis.patch.yml (id-targeted) or via a --patch overlay.

- insert:
    - id: matlab-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        # Server namespace — tool names become mcp__matlab__<rawToolName>
        serverName: matlab
        transport: stdio

        # env override first, then Agentic Toolkits default, then PATH lookup
        command: !!js process.env.MATLAB_MCP_SERVER_BINARY || (process.env.HOME && (process.env.HOME + '/.matlab/agentic-toolkits/bin/matlab-mcp-server')) || 'matlab-mcp-server'

        # Patching `args` REPLACES the whole list — keep all flags below.
        args:
          - '--matlab-display-mode=nodesktop'
          - '--matlab-session-mode=auto'
          - '--disable-telemetry=true'
          - '--log-level=info'
          # lazy start: MATLAB spins up on first tool call, not at server start
          - '--initialize-matlab-on-startup=false'
          # MathWorks Simulink Agentic Toolkit extension (adds model_read /
          # model_edit / model_check / model_test ...). A missing file is
          # tolerated. NOTE: the path must follow the --extension-file flag —
          # a bare path is parsed as a positional arg and silently ignored,
          # leaving only the 5 base tools instead of 14 (verified 2026-09-27).
          - '--extension-file'
          - !!js process.env.MATLAB_SIMULINK_TOOLS_FILE || (process.env.HOME && (process.env.HOME + '/.matlab/agentic-toolkits/simulink/tools/tools.json')) || 'tools.json'

        # Extra child-process env vars (e.g. MW_MCP_SERVER_MATLAB_ROOT,
        # MW_MCP_SERVER_INITIAL_WORKING_FOLDER). Parent env is inherited.
        env: {}

        cwd: !!js process.cwd()

        # MATLAB eval / script runs / simulations can be slow; raise for
        # long-running simulations.
        toolCallTimeoutMs: 120000

        # MATLAB being unavailable at startup must not break the whole agent.
        failOnStartupError: false
